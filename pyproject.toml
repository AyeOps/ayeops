[project]
name = "ayeops"
version = "0.3.0"
description = "Open-source ops kit: a service catalog that refuses unmonitored services and the monitoring stack it renders."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "jsonschema>=4.23",
    "packaging>=26.3",
    "pyyaml>=6.0.2",
    "tzdata>=2025.2",
]

[project.scripts]
aye = "ayeops.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/ayeops", "docs/runbooks"]

[tool.hatch.build.targets.wheel]
packages = ["src/ayeops"]

[tool.hatch.build.targets.wheel.force-include]
"docs/runbooks" = "ayeops/runbooks"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-xdist>=3.8",
    "ruff>=0.11",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12",
]
mutants = ["mutmut==3.8.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
per-file-target-version = { "src/ayeops/report.py" = "py310", "ci/aye-report.py" = "py310" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
"src/ayeops/portal/i18n.py" = ["RUF001"]
"src/ayeops/baseline.py" = ["RUF001"]
"tests/test_baseline.py" = ["RUF001"]
"tests/test_portal_i18n.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["allauth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 600
markers = ["e2e: needs the running end-to-end stack, see docs/e2e.md"]

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/ayeops/backups.py",
    "src/ayeops/baseline.py",
    "src/ayeops/checks_sql.py",
    "src/ayeops/dashboards.py",
    "src/ayeops/datastores.py",
    "src/ayeops/defaults.py",
    "src/ayeops/deploy.py",
    "src/ayeops/eol.py",
    "src/ayeops/i18n.py",
    "src/ayeops/inventory.py",
    "src/ayeops/modules/eol/files/eol_agent.py",
    "src/ayeops/modules/hygiene/files/hygiene_runner.py",
    "src/ayeops/modules/mcp/files/catalog_server.py",
    "src/ayeops/modules/objectstore/files/reststore_admin.py",
    "src/ayeops/modules/oncall/files/oncall_bridge.py",
    "src/ayeops/modules/reconciler/files/reconciler.py",
    "src/ayeops/modules/sentinel/files/sentinel.py",
    "src/ayeops/modules/updates/files/updates_agent.py",
    "src/ayeops/modules/vulns/files/vulns_agent.py",
    "src/ayeops/mounts.py",
    "src/ayeops/portal/disks.py",
    "src/ayeops/promql.py",
    "src/ayeops/render_index.py",
    "src/ayeops/sentinel.py",
    "src/ayeops/status_deploy.py",
    "src/ayeops/strict.py",
    "src/ayeops/texthygiene.py",
    "src/ayeops/unused.py",
    "src/ayeops/up.py",
    "src/ayeops/yamlkeys.py",
]
also_copy = [".env.example", ".github/", "AGENTS.md", "README.md", "cloud/status/contract/", "cloud/status/migrations/", "cloud/status/wrangler.toml", "docs/", "examples/", "renovate.json"]
pytest_add_cli_args_test_selection = [
    "tests/test_backups.py",
    "tests/test_baseline.py",
    "tests/test_dashboards.py",
    "tests/test_datastores.py",
    "tests/test_defaults.py",
    "tests/test_deploy.py",
    "tests/test_eol.py",
    "tests/test_hygiene.py",
    "tests/test_injection.py",
    "tests/test_inventory.py",
    "tests/test_mcp_catalog_server.py",
    "tests/test_oncall_bridge.py",
    "tests/test_oncall_topics.py",
    "tests/test_portal_i18n.py",
    "tests/test_promql.py",
    "tests/test_reconciler.py",
    "tests/test_render_index.py",
    "tests/test_reststore.py",
    "tests/test_reststore_admin.py",
    "tests/test_sentinel.py",
    "tests/test_sentinel_module.py",
    "tests/test_sql_checks.py",
    "tests/test_status_deploy.py",
    "tests/test_strict.py",
    "tests/test_texthygiene.py",
    "tests/test_unused.py",
    "tests/test_up.py",
    "tests/test_updates.py",
    "tests/test_vulns.py",
    "tests/test_yamlkeys.py",
]
