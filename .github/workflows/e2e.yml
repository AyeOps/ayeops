name: e2e

on:
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      runner:
        description: "Where e2e runs: hosted is ubuntu-latest, self-hosted the labels of AYE_RUNS_ON"
        type: choice
        options:
          - hosted
          - self-hosted
        default: hosted

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && vars.AYE_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    env:
      AYE_E2E_BOX: aye-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: room for images
        if: runner.environment == 'github-hosted'
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force > /dev/null
          df -h /
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ]; then
            config=/etc/docker/daemon.json
            current=$(sudo cat "$config" 2>/dev/null || echo '{}')
            echo "$current" | jq '. + {"data-root": "/mnt/docker"}' | sudo tee "$config"
            sudo systemctl restart docker
          fi
          docker info --format '{{.DockerRootDir}}'
      - name: box
        run: sh tests/e2e/box.sh start
      - name: render
        run: sh tests/e2e/box.sh exec uv run python -m tests.e2e.stack render /tmp/aye-e2e
      - name: prepare
        run: sh tests/e2e/box.sh exec uv run python -m tests.e2e.stack prepare /tmp/aye-e2e
      - name: up
        timeout-minutes: 9
        run: sh tests/e2e/box.sh exec uv run python -m tests.e2e.stack up /tmp/aye-e2e
      - name: smoke
        timeout-minutes: 10
        run: sh tests/e2e/box.sh exec env E2E=1 uv run pytest tests/e2e -m e2e -v -rs
      - name: collect logs
        if: failure()
        run: sh tests/e2e/box.sh logs e2e-logs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs
          retention-days: 7
      - name: remove the box
        if: always()
        run: sh tests/e2e/box.sh stop
