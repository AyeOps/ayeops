name: Docs problem
description: A page of the docs or a runbook is wrong, out of date, unclear or missing.
title: "Docs: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The file or link, with the section if you know it.
      placeholder: docs/modules.md, section probes
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - It says something the kit does not do
        - It is out of date
        - It is unclear
        - Something is missing
        - A runbook did not help during an alert
        - A link is broken
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What the page says, what is true, and what you were trying to do when you read it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested text
      description: Optional. A pull request with the fix is welcome too.
