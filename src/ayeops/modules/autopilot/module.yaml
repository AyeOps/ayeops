name: autopilot
summary: Autopilot level 1 in shadow mode. A critical alert from Grafana starts one run per alert fingerprint; plain code collects a dossier from metrics, logs, container state and recent deploys, a model ranks up to three hypotheses with evidence and the action that would test each, and the run is written to a journal. After the incident resolves, the reconciler, the incident journal or a person labels which hypothesis matched what fixed it, and the hit rate is exported per incident class and rank. Nothing runs and nobody is messaged unless post_verdict is set.
requires:
  grafana: {}
  metrics: {}
defaults:
  runner: api
  auth: api_key
  claude_binary: null
  model: claude-sonnet-5-5
  escalation_model: claude-opus-5-5
  critical_services: []
  lookback_minutes: 60
  dossier_tokens: 4000
  run_usd: 0.5
  run_seconds: 180
  runs_per_hour: 4
  day_usd: 3
  night_usd: 2
  quiet_hours:
    start: "23:00"
    end: "08:00"
  timezone: UTC
  post_verdict: false
  mask: []
  mask_env: []
  resources: {}
settings_schema:
  type: object
  additionalProperties: false
  properties:
    runner:
      enum: [api, claude-code, none]
    auth:
      enum: [api_key, subscription]
    claude_binary:
      type: [string, "null"]
      pattern: '^/[A-Za-z0-9._/-]+$'
    model:
      type: string
      pattern: '^claude-[a-z0-9-]{1,60}$'
    escalation_model:
      type: string
      pattern: '^claude-[a-z0-9-]{1,60}$'
    critical_services:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: '^[a-z0-9][a-z0-9_.-]{0,62}$'
    lookback_minutes:
      type: integer
      minimum: 10
      maximum: 360
    dossier_tokens:
      type: integer
      minimum: 1000
      maximum: 8000
    run_usd:
      type: number
      exclusiveMinimum: 0
      maximum: 5
    run_seconds:
      type: integer
      minimum: 30
      maximum: 600
    runs_per_hour:
      type: integer
      minimum: 1
      maximum: 60
    day_usd:
      type: number
      exclusiveMinimum: 0
    night_usd:
      type: number
      exclusiveMinimum: 0
    quiet_hours:
      type: [object, "null"]
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    timezone:
      type: string
      pattern: '^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$'
    post_verdict:
      type: boolean
    mask:
      type: array
      maxItems: 50
      items:
        type: string
        minLength: 1
        maxLength: 500
    mask_env:
      type: array
      uniqueItems: true
      maxItems: 50
      items:
        type: string
        pattern: '^[A-Z][A-Z0-9_]{0,79}$'
services:
  autopilot:
    description: Takes critical alerts from Grafana, collects a dossier with plain code and asks a model for ranked hypotheses within hard spend caps; shadow mode, it runs no action, and the journal of every run stays in its volume.
    memory: 128m
    cpus: 0.25
    metrics: [ayeops_autopilot_runs_total, ayeops_autopilot_cap_reached, ayeops_autopilot_cost_usd_total, ayeops_autopilot_answer_seconds_sum, ayeops_autopilot_hit_rate, ayeops_autopilot_masked_total]
    alerts: [target-down, autopilot-failing, autopilot-cap-reached]
    logs: docker
    status:
      internal: an operator tool that diagnoses alerts, users never see it
alerts:
  - name: autopilot-failing
    title: Autopilot runs fail
    expr: sum by (host, project, group) (increase(ayeops_autopilot_runs_total{status="failed"}[1h])) > bool 0
    for: 0m
    severity: warning
    summary: "An autopilot run on {{ .Labels.host }} failed in the last hour, so a critical alert got no diagnosis"
    runbook: autopilot-failing
  - name: autopilot-cap-reached
    title: Autopilot spend cap reached
    expr: max by (host, project, group, cap) (ayeops_autopilot_cap_reached) == bool 1
    for: 0m
    severity: warning
    summary: "The {{ .Labels.cap }} cap of the autopilot on {{ .Labels.host }} is reached; critical alerts arrive without a diagnosis until it resets"
    runbook: autopilot-cap-reached
dashboards: []
files:
  - src: files/autopilot.py
    dest: autopilot/autopilot.py
permissions:
  - issuer: Anthropic
    credential: API key
    env: [AYE_AUTOPILOT_API_KEY]
    when: "settings.auth == 'api_key' and settings.runner != 'none'"
    grants:
      - "a plain API key, not an Admin key, in a workspace of its own with a monthly spend limit above the module's day_usd caps"
  - issuer: Anthropic
    credential: subscription token from claude setup-token
    env: [AYE_AUTOPILOT_OAUTH_TOKEN]
    when: "settings.auth == 'subscription'"
    grants:
      - "the long-lived token of a Claude subscription that is fine to spend on diagnoses; used only by claude -p with every tool off"
  - issuer: Telegram
    credential: bot token of the oncall bridge's bot
    env: [AYE_ONCALL_TELEGRAM_TOKEN]
    when: "settings.post_verdict"
    grants:
      - "the same bot the oncall module uses; it posts the verdict silently to the oncall chat and needs nothing more"
generated:
  - env: [AYE_AUTOPILOT_WEBHOOK_SECRET]
    format: hex
    bytes: 32
