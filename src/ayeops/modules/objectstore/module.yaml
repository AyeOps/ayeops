name: objectstore
summary: Self-hosted store for the off-site backups of other hosts, either Garage (S3, one bucket with a size quota) or an append-only restic REST server whose clients cannot delete what they wrote.
requires:
  metrics: {}
defaults:
  provider: garage
  bucket: offsite
  quota: 40g
  region: garage
  data_dir: null
  meta_dir: null
  prune_schedule: "11:00"
  expose: []
  resources: {}
settings_schema:
  type: object
  additionalProperties: false
  properties:
    provider:
      enum: [garage, rest-server]
    bucket:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    quota:
      type: string
      pattern: '^[0-9]+[mgt]$'
    region:
      type: string
      pattern: '^[a-z0-9-]+$'
    data_dir:
      type: [string, "null"]
      pattern: '^/[^:\s]*$'
    meta_dir:
      type: [string, "null"]
      pattern: '^/[^:\s]*$'
    prune_schedule:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    expose:
      type: array
      items:
        enum: [3900, 8000]
services:
  garage:
    description: S3 API on 3900 for the restic repositories of the off-site agents, one bucket with a size quota; admin API and Prometheus metrics on 3903, loopback only.
    memory: 256m
    cpus: 1.0
    metrics: [cluster_healthy, garage_local_disk_avail, api_s3_request_counter]
    alerts: [objectstore-down, objectstore-unhealthy]
    logs: docker
    status:
      internal: stores the off-site backup copies; users never see it until a restore needs it
  garage-admin:
    description: Keeps the bucket quota equal to the manifest through Garage's admin API every 5 minutes and serves the bucket's size, objects and quota as Prometheus metrics on 9132.
    memory: 32m
    cpus: 0.1
    metrics: [ayeops_objectstore_bucket_bytes, ayeops_objectstore_bucket_quota_bytes, ayeops_objectstore_admin_ok]
    alerts: [objectstore-quota, objectstore-admin, target-down]
    logs: docker
    status:
      internal: configuration and usage reporting of the object store
  rest-server:
    description: restic REST server 0.14 on 8000 in append-only mode with private repositories, one user per backing-up host from an htpasswd file built in tmpfs at start; clients can add snapshots and never delete them.
    memory: 128m
    cpus: 1.0
    metrics: [ayeops_reststore_server_up, rest_server_blob_write_bytes_total]
    alerts: [reststore-down]
    logs: docker
    status:
      internal: stores the off-site backup copies; users never see it until a restore needs it
  reststore-admin:
    description: Applies each client's retention with restic forget and prune straight on the repository directory once a day, measures the store against its quota, and serves its own metrics with rest-server's on 9133.
    memory: 512m
    cpus: 1.0
    metrics: [ayeops_reststore_maintenance_last_success_timestamp_seconds, ayeops_reststore_maintenance_ok, ayeops_reststore_snapshots, ayeops_reststore_data_bytes]
    alerts: [reststore-maintenance, reststore-quota, target-down]
    logs: docker
    status:
      internal: retention and usage reporting of the append-only store
  reststore-restic:
    description: Copies the pinned static restic binary from the official image into a volume reststore-admin mounts read-only, then sleeps.
    memory: 64m
    cpus: 0.1
    metrics:
      none: it only holds a file; reststore-maintenance fires without the binary
    alerts: [reststore-maintenance]
    logs: docker
    status:
      internal: tool of the store's maintenance
  offsite-drill:
    description: Restores the newest off-site snapshot of every client with a restore_drill into a throwaway PostgreSQL cluster on scratch storage, from the repository mounted read-only and without a network, on schedule; runs the client's SQL checks, measures how long the restore took and wipes everything afterwards.
    memory: 1g
    cpus: 2.0
    metrics: [ayeops_offsite_drill_ok, ayeops_offsite_drill_last_success_timestamp_seconds, ayeops_offsite_drill_duration_seconds, ayeops_offsite_drill_restored_bytes, ayeops_offsite_drill_check_ok]
    alerts: [offsite-drill]
    logs: docker
    status:
      internal: proves the off-site copies restore into a database; users never see it
alerts:
  - name: objectstore-down
    provider: garage
    title: Object store down
    expr: min by (host, project, group) (up{job="garage"}) == bool 0
    for: 5m
    severity: critical
    summary: "Garage on {{ .Labels.host }} does not answer: off-site backups cannot be written or restored"
    runbook: objectstore-down
    no_data: alerting
  - name: objectstore-unhealthy
    provider: garage
    title: Object store unhealthy
    expr: min by (host, project, group) (cluster_healthy) == bool 0
    for: 10m
    severity: warning
    summary: "Garage on {{ .Labels.host }} reports its cluster as unhealthy"
    runbook: objectstore-down
  - name: objectstore-quota
    provider: garage
    title: Object store bucket above 80 % of its quota
    expr: max by (host, project, group, bucket) (ayeops_objectstore_bucket_bytes / ayeops_objectstore_bucket_quota_bytes) > bool 0.8
    for: 30m
    severity: warning
    summary: "Bucket {{ .Labels.bucket }} on {{ .Labels.host }} uses more than 80 % of its quota; at 100 % backups fail"
    runbook: objectstore-quota
  - name: objectstore-admin
    provider: garage
    title: Object store quota and usage not reconciled for an hour
    expr: max by (host, project, group) ((time() - ayeops_objectstore_admin_last_success_timestamp_seconds > bool 3600) + (ayeops_objectstore_admin_ok == bool 0))
    for: 15m
    severity: warning
    summary: "garage-admin on {{ .Labels.host }} cannot read or set the bucket through the admin API"
    runbook: objectstore-quota
    no_data: alerting
  - name: reststore-down
    provider: rest-server
    title: Append-only backup store down
    expr: min by (host, project, group) (ayeops_reststore_server_up) == bool 0
    for: 5m
    severity: critical
    summary: "rest-server on {{ .Labels.host }} does not answer: off-site backups cannot be written or restored"
    runbook: reststore-down
    no_data: alerting
  - name: reststore-maintenance
    provider: rest-server
    title: Off-site retention on the store failed or older than 50 hours
    expr: max by (host, project, group, repo) ((time() - ayeops_reststore_maintenance_last_success_timestamp_seconds > bool 180000) + (ayeops_reststore_maintenance_ok == bool 0))
    for: 10m
    severity: warning
    summary: "forget and prune of the repository {{ .Labels.repo }} on {{ .Labels.host }} failed or has not passed for 50 hours"
    runbook: reststore-maintenance
  - name: reststore-quota
    provider: rest-server
    title: Append-only store above 80 % of its quota
    expr: max by (host, project, group) (ayeops_reststore_data_bytes / ayeops_reststore_quota_bytes) > bool 0.8
    for: 30m
    severity: warning
    summary: "The append-only store on {{ .Labels.host }} uses more than 80 % of its quota; at 100 % backups fail"
    runbook: objectstore-quota
dashboards: []
files:
  - src: files/garage.toml
    dest: objectstore/garage.toml
    when: reststore.garage
    template: true
  - src: files/objectstore_admin.py
    dest: objectstore/objectstore_admin.py
    when: reststore.garage
  - src: files/reststore_admin.py
    dest: objectstore/reststore_admin.py
    when: reststore.enabled
  - src: files/restore_drill.sh
    dest: objectstore/restore_drill.sh
    when: drill
  - src: files/drills.sh.j2
    dest: objectstore/drills.sh
    when: drill
    template: true
generated:
  - env: [AYE_OBJECTSTORE_RPC_SECRET, AYE_OBJECTSTORE_SECRET_ACCESS_KEY]
    when: "settings.provider == 'garage'"
    format: hex
    bytes: 32
  - env: [AYE_OBJECTSTORE_ADMIN_TOKEN]
    when: "settings.provider == 'garage'"
    format: base64
    bytes: 32
  - env: [AYE_OBJECTSTORE_ACCESS_KEY_ID]
    when: "settings.provider == 'garage'"
    format: garage-key-id
  - env: [AYE_RESTSTORE_METRICS_PASSWORD]
    when: "settings.provider == 'rest-server'"
    format: base64
    bytes: 33
host_directories:
  - setting: data_dir
    owner: "0:0"
    mode: "0700"
    for: the store's data, written by root in the store's containers
  - setting: meta_dir
    owner: "0:0"
    mode: "0700"
    for: Garage's metadata, written by root in its container
    when: "settings.provider == 'garage'"
