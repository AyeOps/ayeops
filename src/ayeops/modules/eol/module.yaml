name: eol
summary: Reads once a day from endoflife.date until when the products the host runs get support and security fixes (the cycles its image tags carry, its own operating system and listed components) and writes the days left as textfile metrics, with alerts 90 days before security support ends and after it ended.
requires:
  node: {}
defaults:
  schedule: "05:30"
  timezone: UTC
  api: https://endoflife.date/api/v1
  os: true
  components: []
  exclude: []
  resources: {}
settings_schema:
  type: object
  additionalProperties: false
  properties:
    schedule:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    timezone:
      type: string
      pattern: '^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$'
    api:
      type: string
      pattern: '^https://[^\s"$]+[^/\s"$]$'
    os:
      type: boolean
    components:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [name, product, cycle]
        properties:
          name:
            type: string
            pattern: '^[^\s"\\$][^"\\$]{0,79}$'
          product:
            type: string
            pattern: '^[a-z0-9][a-z0-9.+_-]{0,63}$'
          cycle:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$'
    exclude:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: '^[^\s$]+$'
services:
  eol-agent:
    description: Fetches the release cycles of each tracked product from the endoflife.date API once a day into a cached volume, so a failed fetch keeps the last data, reads the host's os-release, and writes the days until end of support and of security support per component as textfile metrics.
    memory: 48m
    cpus: 0.1
    metrics: [ayeops_eol_security_days_left, ayeops_eol_support_days_left, ayeops_eol_security_ended, ayeops_eol_cycle_known, ayeops_eol_last_success_timestamp_seconds]
    alerts: [eol-soon, eol-passed, eol-cycle-unknown, eol-data-stale]
    logs: docker
    status:
      internal: host maintenance telemetry, users never see it
alerts:
  - name: eol-soon
    title: Security support of a component ends within 90 days
    expr: min by (host, project, group, component, product, cycle, date) (ayeops_eol_security_days_left > 0) < bool 90
    for: 1h
    severity: warning
    summary: "{{ .Labels.product }} {{ .Labels.cycle }} ({{ .Labels.component }}) on {{ .Labels.host }} gets no security fixes after {{ .Labels.date }}"
    runbook: eol-soon
  - name: eol-passed
    title: A component no longer gets security fixes
    expr: max by (host, project, group, component, product, cycle) (ayeops_eol_security_ended) > bool 0
    for: 1h
    severity: warning
    summary: "{{ .Labels.product }} {{ .Labels.cycle }} ({{ .Labels.component }}) on {{ .Labels.host }} is past its end of security support"
    runbook: eol-passed
  - name: eol-cycle-unknown
    title: endoflife.date does not know the cycle of a component
    expr: min by (host, project, group, component, product, cycle) (ayeops_eol_cycle_known) == bool 0
    for: 1h
    severity: warning
    summary: "endoflife.date lists no cycle {{ .Labels.cycle }} of {{ .Labels.product }} ({{ .Labels.component }}) on {{ .Labels.host }}, so its end of support is unknown"
    runbook: eol-cycle-unknown
  - name: eol-data-stale
    title: No successful endoflife.date fetch for 3 days
    expr: time() - max by (host, project, group) (ayeops_eol_last_success_timestamp_seconds) > bool 259200
    for: 1h
    severity: warning
    summary: "eol-agent on {{ .Labels.host }} has not fetched every product from endoflife.date for more than 3 days"
    runbook: eol-data-stale
dashboards: []
files:
  - src: files/eol_agent.py
    dest: eol/eol_agent.py
