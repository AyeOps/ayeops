server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /api/v1/query {
        limit_except GET {
            deny all;
        }
        set $metrics victoriametrics:8428;
        proxy_pass http://$metrics/api/v1/query$is_args$args;
        proxy_read_timeout 15s;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/query_range {
        limit_except GET {
            deny all;
        }
        set $metrics victoriametrics:8428;
        proxy_pass http://$metrics/api/v1/query_range$is_args$args;
        proxy_read_timeout 15s;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        return 403;
    }

    location / {
        limit_except GET {
            deny all;
        }
        try_files $uri $uri/ =404;
    }
}
