name: secrets
summary: Self-hosted secrets manager that the .env of every project moves into, Infisical by default, with its own PostgreSQL, Valkey and a daily database dump.
requires:
  metrics: {}
  node: {}
  backups: {}
defaults:
  provider: infisical
  url: null
  backup_hour: 3
  backup_keep_days: 14
  google_login: false
  expose: []
  resources: {}
settings_schema:
  type: object
  additionalProperties: false
  required: [url]
  properties:
    provider:
      enum: [infisical]
    url:
      type: string
      pattern: '^https?://[^/\s]+$'
    backup_hour:
      type: integer
      minimum: 0
      maximum: 23
    backup_keep_days:
      type: integer
      minimum: 1
      maximum: 365
    google_login:
      type: boolean
    expose:
      type: array
      items:
        enum: [8090]
services:
  infisical:
    description: Keeps the secrets of every project per environment and folder; hosts fetch them at deploy time with their own machine identity.
    memory: 1g
    cpus: 1.0
    metrics: [infisical_core_http_request_count_total]
    alerts: [target-down, probe-failing]
    logs: docker
    login: email and password of the admin created on the first visit; hosts sign in as machine identities
    status:
      internal: operator access over the private network, deploys read it but users never do
  infisical-db:
    description: PostgreSQL of the secrets manager; values are stored encrypted with AYE_SECRETS_ENCRYPTION_KEY.
    memory: 256m
    cpus: 0.5
    metrics:
      none: only infisical connects to it, and infisical fails its healthcheck and target-down without it
    alerts: [container-restarting]
    logs: docker
    status:
      internal: storage of the secrets manager
  infisical-cache:
    description: Valkey queue and cache of the secrets manager, in memory only.
    memory: 64m
    cpus: 0.25
    metrics:
      none: only infisical connects to it, and infisical fails its healthcheck and target-down without it
    alerts: [container-restarting]
    logs: docker
    status:
      internal: cache of the secrets manager
  infisical-backup:
    description: Dumps the secrets database once a day into a volume through backups/backup_run.sh, which reports every run under the backup label secrets.
    memory: 64m
    cpus: 0.25
    metrics: [ayeops_backup_last_success_timestamp_seconds, ayeops_backup_last_run_success, ayeops_backup_last_size_bytes]
    alerts: [backup-missing, backup-failed]
    logs: docker
    status:
      internal: backup of the secrets manager
dashboards: []
backup_jobs:
  - name: secrets
    service: infisical-backup
    schedule: "0 {{ settings.backup_hour }} * * *"
    timezone: UTC
    grace: 2h
files:
  - src: files/backup.sh
    dest: secrets/backup.sh
permissions:
  - issuer: Google
    credential: OAuth 2.0 client of type web application
    env: [AYE_SECRETS_GOOGLE_CLIENT_ID, AYE_SECRETS_GOOGLE_CLIENT_SECRET]
    when: "settings.google_login"
    grants:
      - "scopes openid, email and profile only; redirect URI {{ settings.url }}/api/v1/sso/google"
  - issuer: "Infisical at {{ settings.url }}"
    credential: one machine identity per host that runs aye secrets pull
    env: [AYE_SECRETS_CLIENT_ID, AYE_SECRETS_CLIENT_SECRET]
    grants:
      - "Universal Auth with the host's address as the only trusted IP"
      - "a project role that reads its own environment and folder; no write, no other project"
generated:
  - env: [AYE_SECRETS_ENCRYPTION_KEY]
    format: hex
    bytes: 16
  - env: [AYE_SECRETS_AUTH_SECRET]
    format: base64
    bytes: 32
  - env: [AYE_SECRETS_DB_PASSWORD, AYE_SECRETS_CACHE_PASSWORD]
    format: hex
    bytes: 24
