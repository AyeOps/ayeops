      AYE_STATUS_TENANT: acme
      AYE_STATUS_TIMEOUT: 10s
      AYE_STATUS_URL: https://status.acme.example/api/push
    group_add:
    - '10470'
    healthcheck:
      interval: 60s
      retries: 3
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9136/health', timeout=5)
      timeout: 10s
    image: python:3.13.16-alpine3.23@sha256:07b20c774a247152e74f622034c1482495d299e070eec620ddff13e01264290b
    labels:
      io.ayeops.config-hash: d532fe4c50c6ac9a
