    - -I
    - /app/reconciler.py
    cpus: 0.1
    environment:
      AYE_RECONCILER_ATTEMPTS: '3'
      AYE_RECONCILER_DECLARED: '["acme-apps","acme-central"]'
      AYE_RECONCILER_DRY_RUN: 'false'
      AYE_RECONCILER_IGNORE: '[]'
      AYE_RECONCILER_INTERVAL: 30s
      AYE_RECONCILER_PROJECTS: '{"acme-apps":["mcp","web"],"acme-central":["agentgateway","ai-usage-exporter","alloy","autopilot","backup-jobs","blackbox","cadvisor","cloudflare-exporter","garage","garage-admin","github-exporter","goalert","goalert-db","grafana","grafana-reader","incidents-agent","loki","mcp-catalog","mcp-grafana","mcp-s3-bin","mcp-tools","mcp-victoriametrics","node-exporter","oauth2-proxy","oncall-bridge","portal","rdap-exporter","reconciler","status-reporter","traefik","victoriametrics","victoriametrics-backup","vmagent","vmalert"]}'
      AYE_RECONCILER_STATE: /data/state.json
      AYE_RECONCILER_TEXTFILE: /textfile/ayeops_reconciler.prom
      AYE_RECONCILER_TIMEOUT: 2m
      AYE_RECONCILER_WINDOW: 1h
    healthcheck:
      interval: 60s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - python
      - -c
      - import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/reconciler.alive') > 300)
      timeout: 10s
    image: python:3.13.16-alpine3.23@sha256:07b20c774a247152e74f622034c1482495d299e070eec620ddff13e01264290b
    labels:
      io.ayeops.config-hash: 9e9813cefec45c50
      io.ayeops.module: reconciler
      io.ayeops.service: reconciler
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 32m
    network_mode: none
    pids_limit: 32
    platform: linux/arm64
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=4m
    volumes:
    - ./reconciler/reconciler.py:/app/reconciler.py:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - reconciler-data:/data
    - node-textfile:/textfile
