name: acme-central
services:
  agentgateway:
    cap_drop:
    - ALL
    command:
    - -f
    - /config/agentgateway.yaml
    cpus: 0.5
    depends_on:
      mcp-s3-bin:
        condition: service_healthy
      mcp-tools:
        condition: service_healthy
    environment:
      AYE_MCP_BACKUPS_ACCESS_KEY_ID: ${AYE_MCP_BACKUPS_ACCESS_KEY_ID:?set AYE_MCP_BACKUPS_ACCESS_KEY_ID}
      AYE_MCP_BACKUPS_SECRET_ACCESS_KEY: ${AYE_MCP_BACKUPS_SECRET_ACCESS_KEY:?set AYE_MCP_BACKUPS_SECRET_ACCESS_KEY}
      AYE_MCP_GRAFANA_SERVER_TOKEN: ${AYE_MCP_GRAFANA_SERVER_TOKEN:?set AYE_MCP_GRAFANA_SERVER_TOKEN}
      SESSION_KEY: ${AYE_MCP_SESSION_KEY:?set AYE_MCP_SESSION_KEY}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD
      - /opt/aye/tools/busybox
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:15021/healthz/ready
      timeout: 5s
    image: ghcr.io/agentgateway/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    labels:
      io.ayeops.config-hash: 8b0a8b59ee529341
      io.ayeops.module: mcp
      io.ayeops.service: agentgateway
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 256m
    platform: linux/arm64
    ports:
    - 127.0.0.1:3010:3000
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=16m
    volumes:
    - ./mcp:/config:ro
    - mcp-tools:/opt/aye/tools:ro
    - mcp-s3:/opt/aye/s3:ro
  ai-usage-exporter:
    command:
    - python
    - -I
    - /app/ai_usage_exporter.py
    cpus: 0.1
    environment:
      AYE_AI_BUDGETS: '{"anthropic": 50}'
      AYE_AI_PORT: '9147'
      AYE_AI_PROVIDERS: anthropic,openai
      AYE_AI_REFRESH_SECONDS: '900'
      AYE_AI_SPIKE_FLOOR_USD: '1'
      AYE_ANTHROPIC_ADMIN_KEY: ${AYE_ANTHROPIC_ADMIN_KEY:?set AYE_ANTHROPIC_ADMIN_KEY}
      AYE_OPENAI_ADMIN_KEY: ${AYE_OPENAI_ADMIN_KEY:?set AYE_OPENAI_ADMIN_KEY}
    healthcheck:
      interval: 60s
      retries: 3
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9147/health', timeout=5)
      timeout: 10s
    image: python:3.13.16-alpine3.23@sha256:07b20c774a247152e74f622034c1482495d299e070eec620ddff13e01264290b
    labels:
      io.ayeops.config-hash: 0c5c7e58e3a9b437
      io.ayeops.module: ai-usage
      io.ayeops.service: ai-usage-exporter
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 64m
    platform: linux/arm64
    ports:
    - 127.0.0.1:9147:9147
    restart: unless-stopped
    user: 65534:65534
    volumes:
    - ./ai-usage/ai_usage_exporter.py:/app/ai_usage_exporter.py:ro
  alloy:
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/var/lib/alloy/data
    - --disable-reporting
    - /etc/alloy/config.alloy
    cpus: 0.5
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - bash
      - -c
      - "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      timeout: 5s
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    labels:
      io.ayeops.config-hash: d041dfcfc980c77e
      io.ayeops.module: logs
      io.ayeops.service: alloy
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 256m
    platform: linux/arm64
    ports:
    - 127.0.0.1:12345:12345
    restart: unless-stopped
    volumes:
    - ./logs/config.alloy:/etc/alloy/config.alloy:ro
    - alloy-data:/var/lib/alloy/data
    - /var/run/docker.sock:/var/run/docker.sock:ro
  autopilot:
    cap_drop:
    - ALL
    command:
    - python
    - -I
    - /app/autopilot.py
    cpus: 0.25
    environment:
      AYE_AUTOPILOT_API_KEY: ${AYE_AUTOPILOT_API_KEY:?set AYE_AUTOPILOT_API_KEY}
      AYE_AUTOPILOT_AUTH: api_key
      AYE_AUTOPILOT_CATALOG: /app/catalog.json
      AYE_AUTOPILOT_CRITICAL_SERVICES: '["web"]'
      AYE_AUTOPILOT_DAY_USD: '3'
      AYE_AUTOPILOT_DOSSIER_TOKENS: '4000'
      AYE_AUTOPILOT_ESCALATION_MODEL: claude-opus-5-5
      AYE_AUTOPILOT_INCIDENTS: /incidents/incidents.jsonl
      AYE_AUTOPILOT_LOKI_URL: http://loki:3100
      AYE_AUTOPILOT_LOOKBACK_MINUTES: '60'
      AYE_AUTOPILOT_METRICS_URL: http://victoriametrics:8428
      AYE_AUTOPILOT_MODEL: claude-sonnet-5-5
      AYE_AUTOPILOT_NIGHT_USD: '2'
      AYE_AUTOPILOT_POST_VERDICT: 'false'
      AYE_AUTOPILOT_QUIET_END: 08:00
      AYE_AUTOPILOT_QUIET_START: '23:00'
      AYE_AUTOPILOT_RUNNER: api
      AYE_AUTOPILOT_RUNS_PER_HOUR: '4'
      AYE_AUTOPILOT_RUN_SECONDS: '180'
      AYE_AUTOPILOT_RUN_USD: '0.5'
      AYE_AUTOPILOT_STATE: /tmp
      AYE_AUTOPILOT_TIMEZONE: Europe/Kyiv
      AYE_AUTOPILOT_WEBHOOK_SECRET: ${AYE_AUTOPILOT_WEBHOOK_SECRET:?set AYE_AUTOPILOT_WEBHOOK_SECRET}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)
      timeout: 10s
    image: python:3.13.16-alpine3.23@sha256:07b20c774a247152e74f622034c1482495d299e070eec620ddff13e01264290b
    labels:
      io.ayeops.config-hash: 77ca902f4ea2e3a0
      io.ayeops.module: autopilot
      io.ayeops.service: autopilot
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 128m
    platform: linux/arm64
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    user: 65534:65534
    volumes:
    - ./autopilot/autopilot.py:/app/autopilot.py:ro
    - ./autopilot/catalog.json:/app/catalog.json:ro
    - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    - autopilot-state:/tmp
    - incidents-journal:/incidents:ro
  backup-jobs:
    cap_drop:
    - ALL
    command:
    - sh
    - /backups/backup_jobs.sh
    cpus: 0.05
    environment:
      AYE_BACKUP_INTERVAL: '300'
      AYE_BACKUP_JOBS: metrics=93600
      AYE_BACKUP_RPO: ''
      AYE_TEXTFILE_DIR: /textfile
    healthcheck:
      interval: 60s
      retries: 3
      test:
      - CMD-SHELL
      - find /textfile/ayeops_backups.prom -mmin -16 | grep -q .
      timeout: 5s
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    init: true
    labels:
      io.ayeops.config-hash: b929bb5d0e726537
      io.ayeops.module: backups
      io.ayeops.service: backup-jobs
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 16m
    network_mode: none
    platform: linux/arm64
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - ./backups/backup_jobs.sh:/backups/backup_jobs.sh:ro
    - node-textfile:/textfile
  blackbox:
    command:
    - --config.file=/etc/blackbox/blackbox.yml
    cpus: 0.25
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9115/-/healthy
      timeout: 5s
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    labels:
      io.ayeops.config-hash: 6cb112ecf2c28187
      io.ayeops.module: probes
      io.ayeops.service: blackbox
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 64m
    platform: linux/arm64
    ports:
    - 127.0.0.1:9115:9115
    restart: unless-stopped
    volumes:
    - ./probes/blackbox.yml:/etc/blackbox/blackbox.yml:ro
  cadvisor:
    command:
    - --housekeeping_interval=30s
    - --docker_only=true
    - --store_container_labels=false
    cpus: 0.5
    devices:
    - /dev/kmsg
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/healthz
      timeout: 5s
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    labels:
      io.ayeops.module: containers
      io.ayeops.service: cadvisor
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 256m
    platform: linux/arm64
    ports:
    - 127.0.0.1:8080:8080
    privileged: true
    restart: unless-stopped
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /dev/disk/:/dev/disk:ro
  cloudflare-exporter:
    command:
    - python
    - -I
    - /app/cloudflare_exporter.py
    cpus: 0.5
    environment:
      AYE_CLOUDFLARE_ACCOUNTS: 0123456789abcdef0123456789abcdef
      AYE_CLOUDFLARE_ANALYTICS_TOKEN: ${AYE_CLOUDFLARE_ANALYTICS_TOKEN:?set AYE_CLOUDFLARE_ANALYTICS_TOKEN}
      AYE_CLOUDFLARE_LAG_SECONDS: '180'
      AYE_CLOUDFLARE_LIMITS: '{}'
      AYE_CLOUDFLARE_PORT: '9131'
      AYE_CLOUDFLARE_REFRESH_SECONDS: '300'
      AYE_CLOUDFLARE_TOP_COUNTRIES: '10'
      AYE_CLOUDFLARE_TOP_HOSTS: '20'
      AYE_CLOUDFLARE_WINDOW_SECONDS: '900'
      AYE_CLOUDFLARE_ZONES: acme.example
    healthcheck:
      interval: 60s
      retries: 3
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9131/health', timeout=5)
      timeout: 10s
    image: python:3.13.16-alpine3.23@sha256:07b20c774a247152e74f622034c1482495d299e070eec620ddff13e01264290b
    labels:
      io.ayeops.config-hash: c1f4b1b8912f5f4c
      io.ayeops.module: cloudflare
      io.ayeops.service: cloudflare-exporter
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 64m
    platform: linux/arm64
    ports:
    - 127.0.0.1:9131:9131
    restart: unless-stopped
    user: 65534:65534
    volumes:
    - ./cloudflare/cloudflare_exporter.py:/app/cloudflare_exporter.py:ro
  garage:
    command:
    - /garage
    - server
    - --single-node
    - --default-bucket
    cpus: 1.0
    environment:
      GARAGE_ADMIN_TOKEN: ${AYE_OBJECTSTORE_ADMIN_TOKEN:?set AYE_OBJECTSTORE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${AYE_OBJECTSTORE_ACCESS_KEY_ID:?set AYE_OBJECTSTORE_ACCESS_KEY_ID}
      GARAGE_DEFAULT_BUCKET: acme-offsite
      GARAGE_DEFAULT_SECRET_KEY: ${AYE_OBJECTSTORE_SECRET_ACCESS_KEY:?set AYE_OBJECTSTORE_SECRET_ACCESS_KEY}
      GARAGE_RPC_SECRET: ${AYE_OBJECTSTORE_RPC_SECRET:?set AYE_OBJECTSTORE_RPC_SECRET}
      RUST_LOG: garage=info
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - /garage
      - health
      timeout: 10s
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    labels:
      io.ayeops.config-hash: fba9742118e2c8d8
      io.ayeops.module: objectstore
      io.ayeops.service: garage
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 256m
    platform: linux/arm64
    ports:
    - 10.8.0.1:3900:3900
    - 127.0.0.1:3903:3903
    restart: unless-stopped
    volumes:
    - ./objectstore/garage.toml:/etc/garage.toml:ro
    - objectstore-meta:/var/lib/garage/meta
    - objectstore-data:/var/lib/garage/data
  garage-admin:
    cap_drop:
    - ALL
    command:
    - python
    - -I
    - /app/objectstore_admin.py
    cpus: 0.1
    depends_on:
      garage:
        condition: service_healthy
    environment:
      AYE_GARAGE_ADMIN_URL: http://garage:3903
      AYE_OBJECTSTORE_ADMIN_PORT: '9132'
      AYE_OBJECTSTORE_BUCKET: acme-offsite
      AYE_OBJECTSTORE_QUOTA_BYTES: '42949672960'
      GARAGE_ADMIN_TOKEN: ${AYE_OBJECTSTORE_ADMIN_TOKEN:?set AYE_OBJECTSTORE_ADMIN_TOKEN}
    healthcheck:
      interval: 60s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9132/health', timeout=5)
      timeout: 10s
    image: python:3.13.16-alpine3.23@sha256:07b20c774a247152e74f622034c1482495d299e070eec620ddff13e01264290b
    labels:
      io.ayeops.config-hash: fb7d234c87877a1b
      io.ayeops.module: objectstore
      io.ayeops.service: garage-admin
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 32m
    platform: linux/arm64
    ports:
    - 127.0.0.1:9132:9132
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=16m
    user: 65534:65534
    volumes:
    - ./objectstore/objectstore_admin.py:/app/objectstore_admin.py:ro
  github-exporter:
    command:
    - python
    - -I
    - /app/github_exporter.py
    cpus: 0.1
    environment:
      AYE_GITHUB_ACCOUNTS: '[{"included_minutes": 2000, "org": "acme"}]'
      AYE_GITHUB_IMPORT_URL: http://victoriametrics:8428/api/v1/import/prometheus
      AYE_GITHUB_LOOKBACK_HOURS: '72'
      AYE_GITHUB_PORT: '9135'
      AYE_GITHUB_REFRESH_SECONDS: '300'
      AYE_GITHUB_REPORTS: acme/shop
      AYE_GITHUB_STATE: /tmp/imported.json
      AYE_GITHUB_TOKEN: ${AYE_GITHUB_TOKEN:?set AYE_GITHUB_TOKEN}
    healthcheck:
      interval: 60s
      retries: 3
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9135/health', timeout=5)
      timeout: 10s
    image: python:3.13.16-alpine3.23@sha256:07b20c774a247152e74f622034c1482495d299e070eec620ddff13e01264290b
    labels:
      io.ayeops.config-hash: 923482109b8bfc9e
      io.ayeops.module: github
      io.ayeops.service: github-exporter
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 64m
    platform: linux/arm64
    ports:
    - 127.0.0.1:9135:9135
    restart: unless-stopped
    user: 65534:65534
    volumes:
    - ./github/github_exporter.py:/app/github_exporter.py:ro
    - github-state:/tmp
  goalert:
    cpus: 0.5
    depends_on:
      goalert-db:
        condition: service_healthy
    entrypoint:
    - sh
    - /app/goalert_init.sh
    environment:
      AYE_ONCALL_ADMIN_PASSWORD: ${AYE_ONCALL_ADMIN_PASSWORD:?set AYE_ONCALL_ADMIN_PASSWORD}
      AYE_ONCALL_ADMIN_USER: oncall
      AYE_ONCALL_PERSON_EMAIL: oncall@acme.example
      GOALERT_DATA_ENCRYPTION_KEY: ${AYE_ONCALL_ENCRYPTION_KEY:?set AYE_ONCALL_ENCRYPTION_KEY}
      GOALERT_DB_URL: postgres://goalert:${AYE_ONCALL_DB_PASSWORD:?set AYE_ONCALL_DB_PASSWORD}@goalert-db:5432/goalert?sslmode=disable
      GOALERT_LISTEN: :8081
      GOALERT_LISTEN_PROMETHEUS: :9105
      GOALERT_PUBLIC_URL: https://oncall.ops.acme.example
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 120s
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8081/health
      timeout: 5s
    image: goalert/goalert:v0.35.0@sha256:f090a90538d7e61446aad245c21a7a1694d36d7b4f6c56fc55e9cc7405d9c03f
    labels:
      io.ayeops.config-hash: b14576fa4332eb9d
      io.ayeops.module: oncall
      io.ayeops.service: goalert
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 256m
    platform: linux/arm64
    restart: unless-stopped
    volumes:
    - ./oncall/goalert_init.sh:/app/goalert_init.sh:ro
  goalert-db:
    command:
    - postgres
    - -c
    - shared_buffers=32MB
    - -c
    - max_connections=40
    cpus: 0.25
    environment:
      POSTGRES_DB: goalert
      POSTGRES_PASSWORD: ${AYE_ONCALL_DB_PASSWORD:?set AYE_ONCALL_DB_PASSWORD}
      POSTGRES_USER: goalert
    healthcheck:
      interval: 10s
      retries: 6
      start_period: 30s
      test:
      - CMD
      - pg_isready
      - -U
      - goalert
      - -d
      - goalert
      timeout: 5s
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    labels:
      io.ayeops.module: oncall
      io.ayeops.service: goalert-db
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 192m
    platform: linux/arm64
    restart: unless-stopped
    volumes:
    - oncall-db:/var/lib/postgresql
  grafana:
    cpus: 0.5
    environment:
      AYE_AUTOPILOT_WEBHOOK_SECRET: ${AYE_AUTOPILOT_WEBHOOK_SECRET:?set AYE_AUTOPILOT_WEBHOOK_SECRET}
      AYE_GRAFANA_PG_PASSWORD: ${AYE_GRAFANA_PG_PASSWORD:?set AYE_GRAFANA_PG_PASSWORD}
      AYE_ONCALL_WEBHOOK_SECRET: ${AYE_ONCALL_WEBHOOK_SECRET:?set AYE_ONCALL_WEBHOOK_SECRET}
      AYE_TELEGRAM_BOT_TOKEN: ${AYE_TELEGRAM_BOT_TOKEN:?set AYE_TELEGRAM_BOT_TOKEN}
      AYE_TELEGRAM_CHAT_ID: ${AYE_TELEGRAM_CHAT_ID:?set AYE_TELEGRAM_CHAT_ID}
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_GOOGLE_ALLOW_ASSIGN_GRAFANA_ADMIN: 'true'
      GF_AUTH_GOOGLE_ALLOW_SIGN_UP: 'true'
      GF_AUTH_GOOGLE_CLIENT_ID: ${AYE_AUTH_CLIENT_ID:?set AYE_AUTH_CLIENT_ID}
      GF_AUTH_GOOGLE_CLIENT_SECRET: ${AYE_AUTH_CLIENT_SECRET:?set AYE_AUTH_CLIENT_SECRET}
      GF_AUTH_GOOGLE_ENABLED: 'true'
      GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_PATH: contains(['ops@acme.example'], email) && 'GrafanaAdmin' || contains(['ops@acme.example', 'oncall@acme.example'], email) && 'Viewer' || ''
      GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_STRICT: 'true'
      GF_AUTH_GOOGLE_SCOPES: openid email profile
      GF_AUTH_GOOGLE_SKIP_ORG_ROLE_SYNC: 'false'
      GF_AUTH_GOOGLE_USE_PKCE: 'true'
      GF_SECURITY_ADMIN_PASSWORD: ${AYE_GRAFANA_ADMIN_PASSWORD:?set AYE_GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${AYE_GRAFANA_ADMIN_USER:?set AYE_GRAFANA_ADMIN_USER}
      GF_SERVER_ROOT_URL: https://grafana.ops.acme.example
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_FROM_ADDRESS: ops@acme.example
      GF_SMTP_FROM_NAME: Acme Ops
      GF_SMTP_HOST: smtp.mail.example:587
      GF_SMTP_PASSWORD: ${AYE_SMTP_PASSWORD:?set AYE_SMTP_PASSWORD}
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_SMTP_USER: ${AYE_SMTP_USER:?set AYE_SMTP_USER}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    healthcheck:
