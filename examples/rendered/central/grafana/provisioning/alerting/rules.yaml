apiVersion: 1
groups:
- folder: AyeOps
  interval: 1m
  name: ai-usage
  orgId: 1
  rules:
  - annotations:
      __dashboardUid__: ayeops-ai
      __panelId__: '3'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/ai-budget.md
      summary: '{{ .Labels.provider }} spent more than 80% of its monthly budget'
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (sum by (provider) (ayeops_ai_cost_month_usd) / on (provider) ayeops_ai_budget_usd > bool 0.8) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (sum by (provider) (ayeops_ai_cost_month_usd) / on (provider) ayeops_ai_budget_usd > bool 0.8)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 15m
    labels:
      module: ai-usage
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: AI provider budget 80% used
    uid: aye-ai-budget-80
  - annotations:
      __dashboardUid__: ayeops-ai
      __panelId__: '3'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/ai-budget.md
      summary: '{{ .Labels.provider }} spent more than its monthly budget'
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (sum by (provider) (ayeops_ai_cost_month_usd) / on (provider) ayeops_ai_budget_usd > bool 1) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (sum by (provider) (ayeops_ai_cost_month_usd) / on (provider) ayeops_ai_budget_usd > bool 1)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 15m
    labels:
      module: ai-usage
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: critical
    noDataState: OK
    title: AI provider budget exceeded
    uid: aye-ai-budget-exceeded
  - annotations:
      __dashboardUid__: ayeops-ai
      __panelId__: '4'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/ai-spend-spike.md
      summary: '{{ .Labels.provider }} spent today more than three times its median day of the last week'
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (sum by (provider) (ayeops_ai_cost_day_usd) > bool 3 * on (provider) ayeops_ai_cost_daily_median_7d_usd and sum by (provider) (ayeops_ai_cost_day_usd) > on (provider) ayeops_ai_spike_floor_usd) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (sum by (provider) (ayeops_ai_cost_day_usd) > bool 3 * on (provider) ayeops_ai_cost_daily_median_7d_usd and sum by (provider) (ayeops_ai_cost_day_usd) > on (provider) ayeops_ai_spike_floor_usd)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 30m
    labels:
      module: ai-usage
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: AI spend today far above the usual day
    uid: aye-ai-spend-spike
  - annotations:
      __dashboardUid__: ayeops-ai
      __panelId__: '16'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/ai-query-failing.md
      summary: The {{ .Labels.dataset }} report of {{ .Labels.provider }} has failed for 3 hours
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (ayeops_ai_query_success == bool 0) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (ayeops_ai_query_success == bool 0)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 3h
    labels:
      module: ai-usage
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: AI provider report query failing
    uid: aye-ai-query-failing
  - annotations:
      __dashboardUid__: ayeops-ai
      __panelId__: '15'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/ai-key-expiring.md
      summary: The {{ .Labels.provider }} API key {{ .Labels.key }} expires in less than 14 days
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: ((ayeops_ai_api_key_expiry_timestamp_seconds - time()) / 86400 < bool 14) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * ((ayeops_ai_api_key_expiry_timestamp_seconds - time()) / 86400 < bool 14)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 1h
    labels:
      module: ai-usage
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: AI provider API key expires soon
    uid: aye-ai-key-expiring
- folder: AyeOps
  interval: 1m
  name: autopilot
  orgId: 1
  rules:
  - annotations:
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/autopilot-failing.md
      summary: An autopilot run on {{ .Labels.host }} failed in the last hour, so a critical alert got no diagnosis
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (sum by (host, project, group) (increase(ayeops_autopilot_runs_total{status="failed"}[1h])) > bool 0) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (sum by (host, project, group) (increase(ayeops_autopilot_runs_total{status="failed"}[1h])) > bool 0)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 0m
    labels:
      module: autopilot
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: Autopilot runs fail
    uid: aye-autopilot-failing
  - annotations:
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/autopilot-cap-reached.md
      summary: The {{ .Labels.cap }} cap of the autopilot on {{ .Labels.host }} is reached; critical alerts arrive without a diagnosis until it resets
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (max by (host, project, group, cap) (ayeops_autopilot_cap_reached) == bool 1) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (max by (host, project, group, cap) (ayeops_autopilot_cap_reached) == bool 1)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 0m
    labels:
      module: autopilot
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: Autopilot spend cap reached
    uid: aye-autopilot-cap-reached
- folder: AyeOps
  interval: 1m
  name: backups
  orgId: 1
  rules:
  - annotations:
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/backup-failed.md
      summary: The last run of the backup job {{ .Labels.backup }} on {{ .Labels.host }} failed or left no output
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (max by (host, project, group, backup) ((ayeops_backup_last_run_success == bool 0) and on (host, project, group, backup) ayeops_backup_max_age_seconds)) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (max by (host, project, group, backup) ((ayeops_backup_last_run_success == bool 0) and on (host, project, group, backup) ayeops_backup_max_age_seconds))
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 5m
    labels:
      module: backups
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: Backup job failed
    uid: aye-backup-failed
  - annotations:
      __dashboardUid__: ayeops-reliability
      __panelId__: '16'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/backup-missing.md
      summary: The backup job {{ .Labels.backup }} on {{ .Labels.host }} has not succeeded within its schedule plus grace
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (max by (host, project, group, backup) (time() - (max by (host, project, group, backup) (ayeops_backup_last_success_timestamp_seconds) or max by (host, project, group, backup) (ayeops_backup_declared_timestamp_seconds)) > bool on (host, project, group, backup) max by (host, project, group, backup) (ayeops_backup_max_age_seconds))) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (max by (host, project, group, backup) (time() - (max by (host, project, group, backup) (ayeops_backup_last_success_timestamp_seconds) or max by (host, project, group, backup) (ayeops_backup_declared_timestamp_seconds)) > bool on (host, project, group, backup) max by (host, project, group, backup) (ayeops_backup_max_age_seconds)))
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 10m
    labels:
      module: backups
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: critical
    noDataState: Alerting
    title: Backup job missed its schedule
    uid: aye-backup-missing
- folder: AyeOps
  interval: 1m
  name: cloudflare
  orgId: 1
  rules:
  - annotations:
      __dashboardUid__: ayeops-cloudflare
      __panelId__: '4'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/cloudflare-edge-5xx.md
      summary: More than 2% of the requests to {{ .Labels.zone }} end in 5xx at the edge
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: ((sum by (zone) (ayeops_cloudflare_requests{status_class="5xx"}) or sum by (zone) (ayeops_cloudflare_requests) * 0) / sum by (zone) (ayeops_cloudflare_requests) > bool 0.02 and sum by (zone) (ayeops_cloudflare_requests) >= 100) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * ((sum by (zone) (ayeops_cloudflare_requests{status_class="5xx"}) or sum by (zone) (ayeops_cloudflare_requests) * 0) / sum by (zone) (ayeops_cloudflare_requests) > bool 0.02 and sum by (zone) (ayeops_cloudflare_requests) >= 100)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 10m
    labels:
      module: cloudflare
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: Cloudflare edge answers 5xx
    uid: aye-cloudflare-edge-5xx
  - annotations:
      __dashboardUid__: ayeops-cloudflare
      __panelId__: '10'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/cloudflare-origin-errors.md
      summary: Cloudflare answers 520-526 for {{ .Labels.hostname }}
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (sum by (zone, hostname) (ayeops_cloudflare_origin_errors) > bool 0) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (sum by (zone, hostname) (ayeops_cloudflare_origin_errors) > bool 0)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 5m
    labels:
      module: cloudflare
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: Cloudflare cannot reach the origin
    uid: aye-cloudflare-origin-errors
  - annotations:
      __dashboardUid__: ayeops-cloudflare
      __panelId__: '3'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/cloudflare-cache-ratio-drop.md
      summary: The cache hit ratio of {{ .Labels.zone }} is less than half of the same time yesterday
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: ((sum by (zone) (ayeops_cloudflare_requests{cache_status=~"hit|stale|updating|revalidated"}) or sum by (zone) (ayeops_cloudflare_requests) * 0) / sum by (zone) (ayeops_cloudflare_requests) < bool 0.5 * (sum by (zone) (ayeops_cloudflare_requests{cache_status=~"hit|stale|updating|revalidated"} offset 1d) / sum by (zone) (ayeops_cloudflare_requests offset 1d)) and sum by (zone) (ayeops_cloudflare_requests) >= 100) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * ((sum by (zone) (ayeops_cloudflare_requests{cache_status=~"hit|stale|updating|revalidated"}) or sum by (zone) (ayeops_cloudflare_requests) * 0) / sum by (zone) (ayeops_cloudflare_requests) < bool 0.5 * (sum by (zone) (ayeops_cloudflare_requests{cache_status=~"hit|stale|updating|revalidated"} offset 1d) / sum by (zone) (ayeops_cloudflare_requests offset 1d)) and sum by (zone) (ayeops_cloudflare_requests) >= 100)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 30m
    labels:
      module: cloudflare
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: info
    noDataState: OK
    title: Cloudflare cache hit ratio dropped
    uid: aye-cloudflare-cache-ratio-drop
  - annotations:
      __dashboardUid__: ayeops-cloudflare
      __panelId__: '12'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/cloudflare-free-limit.md
      summary: '{{ .Labels.resource }} of account {{ .Labels.account }} passed 80% of its free limit'
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (ayeops_cloudflare_usage / ayeops_cloudflare_free_limit > bool 0.8) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (ayeops_cloudflare_usage / ayeops_cloudflare_free_limit > bool 0.8)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 15m
    labels:
      module: cloudflare
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: Cloudflare free limit 80% used
    uid: aye-cloudflare-free-limit
  - annotations:
      __dashboardUid__: ayeops-cloudflare
      __panelId__: '17'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/cloudflare-query-failing.md
      summary: The {{ .Labels.dataset }} query for {{ .Labels.target }} has failed for 30 minutes
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (ayeops_cloudflare_query_success == bool 0) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (ayeops_cloudflare_query_success == bool 0)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 30m
    labels:
      module: cloudflare
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: Cloudflare analytics query failing
    uid: aye-cloudflare-query-failing
- folder: AyeOps
  interval: 1m
  name: containers
  orgId: 1
  rules:
  - annotations:
      __dashboardUid__: ayeops-health
      __panelId__: '17'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/container-restarting.md
      summary: '{{ .Labels.name }} on {{ .Labels.host }} restarted more than twice in 15 minutes'
    condition: C
    data:
    - datasourceUid: victoriametrics
      model:
        expr: (changes(container_start_time_seconds{name!=""}[15m]) > bool 2) unless on (host) (max by (host) (last_over_time(up{job="node"}[1d]) * (lag(up{job="node"}[1d]) < bool 180)) == 0) or 0 * (changes(container_start_time_seconds{name!=""}[15m]) > bool 2)
        instant: true
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
        expression: A
        refId: C
        type: threshold
      refId: C
      relativeTimeRange:
        from: 0
        to: 0
    execErrState: Error
    for: 0m
    labels:
      module: containers
      scope: '{{ if $$labels.group }}{{ $$labels.group }}{{ else if $$labels.host }}{{ $$labels.host }}{{ end }}'
      severity: warning
    noDataState: OK
    title: Container restarting
    uid: aye-container-restarting
  - annotations:
      __dashboardUid__: ayeops-health
      __panelId__: '15'
      runbook_url: https://github.com/AyeOps/ayeops/blob/main/docs/runbooks/container-throttled.md
      summary: '{{ .Labels.name }} on {{ .Labels.host }} used more than 80 % of its CPU limit on average over 30 minutes'
    condition: C
    data:
