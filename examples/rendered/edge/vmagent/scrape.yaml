global:
  scrape_interval: 60s
scrape_configs:
- job_name: cadvisor
  static_configs:
  - targets:
    - cadvisor:8080
- job_name: gpu
  static_configs:
  - targets:
    - nvidia-gpu-exporter:9835
- job_name: alloy
  static_configs:
  - targets:
    - alloy:12345
- job_name: vmagent
  static_configs:
  - targets:
    - vmagent:8429
- job_name: network
  metric_relabel_configs:
  - action: keep
    regex: enp3s0|wlan0
    source_labels:
    - device
  static_configs:
  - targets:
    - net-exporter:9101
- job_name: node
  static_configs:
  - targets:
    - node-exporter:9100
- job_name: blackbox-icmp
  metrics_path: /probe
  params:
    module:
    - icmp
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - replacement: blackbox:9115
    target_label: __address__
  scrape_interval: 15s
  scrape_timeout: 15s
  static_configs:
  - labels:
      layer: gateway
    targets:
    - 192.168.1.1
  - labels:
      layer: internet
    targets:
    - 1.1.1.1
    - 8.8.8.8
- job_name: blackbox-dns
  metrics_path: /probe
  params:
    module:
    - dns
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - replacement: blackbox:9115
    target_label: __address__
  scrape_interval: 15s
  scrape_timeout: 15s
  static_configs:
  - labels:
      layer: dns
    targets:
    - 1.1.1.1
    - 8.8.8.8
- job_name: blackbox
  static_configs:
  - targets:
    - blackbox:9115
- job_name: sentinel
  static_configs:
  - targets:
    - sentinel:9134
- job_name: smartctl
  scrape_interval: 60s
  scrape_timeout: 50s
  static_configs:
  - targets:
    - smartctl-exporter:9633
